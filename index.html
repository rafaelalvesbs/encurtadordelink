<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encurtador de Links</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background-color: #f1f5f9;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
            display: none;
            text-align: center;
        }

        .result-box p {
            margin: 0 0 0.75rem 0;
            font-size: 0.9rem;
            color: #64748b;
        }

        .short-url {
            display: block;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            word-break: break-all;
            margin-bottom: 1rem;
        }

        .short-url:hover {
            text-decoration: underline;
        }

        #copyBtn {
            background-color: #475569;
            width: auto;
            padding: 0.5rem 1.5rem;
        }

        #copyBtn:hover {
            background-color: #334155;
        }

        .message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .error { color: #ef4444; }
        .success { color: #10b981; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Encurtador de Links</h1>
        
        <div class="form-group">
            <label for="longUrl">Cole o link longo aqui:</label>
            <input type="url" id="longUrl" placeholder="https://seusite.com/pagina-muito-longa" autocomplete="off" required>
        </div>

        <div class="form-group">
            <label for="customAlias">Personalizar o final do link (opcional):</label>
            <input type="text" id="customAlias" placeholder="ex: meu-link-incrivel" autocomplete="off">
        </div>

        <button id="shortenBtn">Encurtar URL</button>

        <div id="statusMessage" class="message"></div>

        <div id="resultBox" class="result-box">
            <p>Seu link encurtado está pronto!</p>
            <a href="#" id="shortUrl" class="short-url" target="_blank"></a>
            <button id="copyBtn">Copiar Link</button>
        </div>
    </div>

    <script>
        const shortenBtn = document.getElementById('shortenBtn');
        const longUrlInput = document.getElementById('longUrl');
        const customAliasInput = document.getElementById('customAlias');
        const statusMessage = document.getElementById('statusMessage');
        const resultBox = document.getElementById('resultBox');
        const shortUrlDisplay = document.getElementById('shortUrl');
        const copyBtn = document.getElementById('copyBtn');

        shortenBtn.addEventListener('click', async () => {
            const longUrl = longUrlInput.value.trim();
            const alias = customAliasInput.value.trim();

            statusMessage.className = 'message';
            statusMessage.textContent = '';
            resultBox.style.display = 'none';

            if (!longUrl) {
                showMessage('Por favor, insira uma URL válida.', 'error');
                return;
            }

            shortenBtn.textContent = 'Encurtando...';
            shortenBtn.disabled = true;

            // Monta a URL da API do is.gd
            let apiUrl = `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`;
            if (alias) {
                apiUrl += `&shorturl=${encodeURIComponent(alias)}`;
            }

            // URL do Proxy (AllOrigins no modo raw)
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.errorcode) {
                    showMessage(data.errormessage, 'error');
                } else if (data.shorturl) {
                    shortUrlDisplay.href = data.shorturl;
                    shortUrlDisplay.textContent = data.shorturl;
                    resultBox.style.display = 'block';
                    showMessage('Link gerado com sucesso!', 'success');
                }
            } catch (error) {
                console.error(error);
                showMessage('Ocorreu um erro ao conectar com o serviço. Tente novamente.', 'error');
            } finally {
                shortenBtn.textContent = 'Encurtar URL';
                shortenBtn.disabled = false;
            }
        });

        copyBtn.addEventListener('click', () => {
            const linkToCopy = shortUrlDisplay.textContent;
            
            navigator.clipboard.writeText(linkToCopy).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copiado!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Falha ao copiar:', err);
                showMessage('Não foi possível copiar o link automaticamente.', 'error');
            });
        });

        function showMessage(text, type) {
            statusMessage.textContent = text;
            statusMessage.className = `message ${type}`;
        }
    </script>
</body>
</html>
